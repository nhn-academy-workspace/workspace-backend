spring:
    application:
        name: backend

    datasource:
        url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password:

    h2:
        console:
            enabled: true
            path: /h2-console

    jpa:
        hibernate:
            ddl-auto: create
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        defer-datasource-initialization: true # data.sql ???? ??

    sql:
        init:
            mode: always # sql ?? ?? ??